name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: .NET SDK kurulumu
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            .config/dotnet-tools.json

      - name: Restore
        id: restore
        run: dotnet restore StockFlow.slnx

      - name: Tool restore
        run: dotnet tool restore

      - name: Build (uyarı = hata)
        run: dotnet build StockFlow.slnx --no-restore -p:TreatWarningsAsErrors=true

      - name: Docker ortamı
        run: docker version

      - name: Test
        run: >
          dotnet test StockFlow.slnx --no-build --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Test özeti
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo '### Test sonucu'
            if ls TestResults/*.trx >/dev/null 2>&1; then
              echo '```'
              grep -ho '<Counters [^>]*>' TestResults/*.trx
              echo '```'
            else
              echo 'Test sonuç dosyası üretilmedi.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test sonuçlarını yükle
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

      - name: Format
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: dotnet format StockFlow.slnx --verify-no-changes --no-restore

  repo-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Depoyu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node kurulumu
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # yerelde test-guard.mjs'i geçiren majör (v24.19.0)

      - name: Guard testleri
        run: node .claude/hooks/agentic/test-guard.mjs

      - name: Repo hijyeni
        if: ${{ !cancelled() }}
        run: pwsh -NoProfile -File scripts/validate-repository-hygiene.ps1
